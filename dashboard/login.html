<!-- login.html -->
<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center h-screen bg-gray-100">

<div class="bg-white p-6 rounded-xl shadow w-80">
<h2 class="text-xl font-bold mb-4">Admin Login</h2>

<input id="email" type="email" placeholder="Email" class="w-full mb-3 p-2 border">
<input id="password" type="password" placeholder="Password" class="w-full mb-3 p-2 border">

<button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded">
    Login
</button>

<p id="error" class="text-red-500 mt-2"></p>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
apiKey: "AIzaSyBJ_FUCYzXVDGEAQP4D9KLOjFhgjT56lZ8",
authDomain: "dosley-76bd1.firebaseapp.com",
projectId: "dosley-76bd1",
};

firebase.initializeApp(firebaseConfig);

function login() {
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

    firebase.auth().signInWithEmailAndPassword(email, password)
    .then(() => {
    window.location.href = "admin_enterprise.html";
    })
    .catch(err => {
    document.getElementById("error").innerText = err.message;
    });
}
</script>

</body>
</html>
